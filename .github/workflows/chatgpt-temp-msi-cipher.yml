name: Temporary encrypted MSI public bridge
on:
  push:
    branches: [chatgpt-temp-msi-cipher-20261004]
permissions:
  contents: write
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stage encrypted ciphertext as temporary release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CIPHER_URL: "https://paste.c-net.org/550324af-4b89-7401-022d-191ab0183b12"
        run: |
          set -euo pipefail
          cipher="$RUNNER_TEMP/RevitMCP-0.2.0-2025-2026-Setup.msi.aes"
          curl -fL --silent --show-error "$CIPHER_URL" -o "$cipher"
          test -s "$cipher"
          size=$(stat -c %s "$cipher")
          if [ "$size" -lt 30000000 ]; then echo "Ciphertext download too small: $size" >&2; exit 1; fi
          sha=$(sha256sum "$cipher" | awk '{print $1}')
          tag="temp-revitmcp-cipher-$GITHUB_RUN_ID"
          gh release create "$tag" "$cipher" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Temporary encrypted RevitMCP transfer" \
            --prerelease \
            --notes "Encrypted ciphertext only. No decryption key is stored in this repository. Temporary transfer asset."
          echo "TEMP_RELEASE_TAG=$tag"
          echo "CIPHER_SIZE=$size"
          echo "CIPHER_SHA256=$sha"
